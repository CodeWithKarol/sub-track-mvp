<h2 mat-dialog-title>Dialog with elements</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Service Name</mat-label>
      <input matInput formControlName="serviceName" />
      <mat-hint>*required</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cost</mat-label>
      <input matInput type="number" formControlName="cost" />
      <mat-hint>*required</mat-hint>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Choose a date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="nextPaymentDate" />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Favorite Food</mat-label>
      <mat-select [(value)]="selectedBillingCycle" formControlName="billingCycle">
        <mat-option></mat-option>
        @for (option of billingCycles; track option) {
          <mat-option [value]="option.value">{{ option.viewValue }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onSubmit()">Create Subscription</button>
  <button matButton mat-dialog-close>Close</button>
</mat-dialog-actions>

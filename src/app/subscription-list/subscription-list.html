<div class="container">
  <section class="header-section">
    <h2>Total Monthly Cost: {{ getTotalCost() | currency }}</h2>
    <button matButton="filled">+ Add Subscription</button>
  </section>

  <section class="subscription-grid">
    @for (subscription of subscriptions; track subscription.id) {
      <mat-card appearance="raised">
        <mat-card-header>
          <mat-card-title>{{ subscription.serviceName }}</mat-card-title>
          <mat-card-subtitle>{{ subscription.cost | currency }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <h3>Next payment date: {{ subscription.nextPaymentDate | date: 'dd-MM-yyyy' }}</h3>
        </mat-card-content>
        <mat-card-actions class="card-actions">
          <button matButton="filled">Edit</button>
          <button matButton="filled" class="error-button">Delete</button>
        </mat-card-actions>

      </mat-card>
    }
  </section>
</div>

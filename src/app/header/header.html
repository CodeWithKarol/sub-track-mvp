<mat-toolbar>
  <button matIconButton>
    <mat-icon>wallet</mat-icon>
  </button>
  <span>SubTrack</span>
  <span class="example-spacer"></span>
  <button matIconButton [disabled]="$numOfDueSubscriptions() === 0">
    <mat-icon [matBadge]="$numOfDueSubscriptions()" [matMenuTriggerFor]="menu"
      >notifications</mat-icon
    >
  </button>
  <mat-menu #menu="matMenu">
    @for (subscription of $dueSubscriptions(); track subscription.id) {
      <button mat-menu-item>
        {{
          `Upcoming payment: ${subscription.serviceName} on ${(subscription.nextPaymentDate | date: 'shortDate')} for ${(subscription.cost | currency)}.`
        }}
      </button>
    }
  </mat-menu>
</mat-toolbar>

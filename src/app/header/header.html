<mat-toolbar>
  <button matIconButton>
    <mat-icon>wallet</mat-icon>
  </button>
  <span>SubTrack</span>
  <span class="example-spacer"></span>
  <button matIconButton>
    <mat-icon [matBadge]="$numOfDueSubscriptions()" [matMenuTriggerFor]="menu">notifications</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    @for (subscription of $dueSubscriptions(); track subscription.id) {
      <button mat-menu-item>{{ subscription.serviceName }}</button>
    }
  </mat-menu>
</mat-toolbar>
